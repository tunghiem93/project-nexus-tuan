openapi: 3.0.3
info:
  title: Project Nexus — User Service API
  version: 1.0.0
  description: |
    Identity, Access Management, Roles, and Reputation.
    All endpoints require Bearer JWT except auth/public routes.
servers:
  - url: http://localhost:8081/api/v1
    description: Local dev

tags:
  - name: Auth
  - name: Users
  - name: Roles
  - name: Reputation
  - name: Health

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (AUTH.LOGIN)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many failed attempts (MAX_LOGIN_ATTEMPTS=5)

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (AUTH.LOGOUT)
      operationId: logout
      responses:
        '204':
          description: Session revoked

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset (PROFILE.RESET_PASSWORD)
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Reset email sent if account exists

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete password reset
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated

  /users:
    get:
      tags: [Users]
      summary: List users (USER.LIST)
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: fullName,asc
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserResponse'
    post:
      tags: [Users]
      summary: Create user (USER.CREATE)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or username already exists

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [Users]
      summary: View user (USER.VIEW)
      operationId: getUser
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update user (USER.UPDATE)
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [Users]
      summary: Soft delete user (USER.DELETE)
      operationId: deleteUser
      responses:
        '204':
          description: User soft-deleted

  /users/{userId}/change-password:
    post:
      tags: [Users]
      summary: Change password (USER.CHANGE_PASSWORD / PROFILE.CHANGE_PASSWORD)
      operationId: changePassword
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password changed
        '400':
          description: Invalid password or same as current

  /users/me:
    get:
      tags: [Users]
      summary: View own profile (PROFILE.VIEW)
      operationId: getMyProfile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /roles:
    get:
      tags: [Roles]
      summary: List roles (ROLE.LIST)
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            default: name,asc
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRoleResponse'
    post:
      tags: [Roles]
      summary: Create role (ROLE.CREATE)
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Roles]
      summary: View role (ROLE.VIEW)
      operationId: getRole
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
    put:
      tags: [Roles]
      summary: Update role (ROLE.UPDATE)
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
    delete:
      tags: [Roles]
      summary: Delete role (ROLE.DELETE)
      operationId: deleteRole
      responses:
        '204':
          description: Role deleted

  /reputation/{userId}:
    get:
      tags: [Reputation]
      summary: View reputation (REPUTATION.VIEW / USER.REPUTATION.VIEW)
      operationId: getReputation
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationResponse'

  /reputation/ratings:
    post:
      tags: [Reputation]
      summary: Rate transaction partner (REPUTATION.RATE)
      operationId: createRating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
      responses:
        '201':
          description: Rating submitted

  /reputation/{userId}/penalties:
    get:
      tags: [Reputation]
      summary: View penalty history (REPUTATION.PENALTY.VIEW)
      operationId: listPenalties
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PenaltyResponse'
    post:
      tags: [Reputation]
      summary: Apply penalty (REPUTATION.PENALTY.APPLY)
      operationId: applyPenalty
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPenaltyRequest'
      responses:
        '201':
          description: Penalty applied

  /health:
    get:
      tags: [Health]
      summary: Service health (SYSTEM.HEALTH.VIEW)
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Healthy

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid credentials or token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds (ACCESS_TOKEN_EXPIRY_MINUTES=60)
        tokenType:
          type: string
          default: Bearer

    CreateUserRequest:
      type: object
      required: [email, phone, fullName, identifyNumber, gender, address, dateOfBirth, password]
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        fullName:
          type: string
        identifyNumber:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER, UNSPECIFIED]
        address:
          type: string
        dateOfBirth:
          type: string
          format: date
        password:
          type: string
          minLength: 8
        roleCodes:
          type: array
          items:
            type: string

    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER, UNSPECIFIED]
        address:
          type: string
        email:
          type: string
          format: email

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        phone:
          type: string
        fullName:
          type: string
        identifyNumber:
          type: string
        gender:
          type: string
        address:
          type: string
        dateOfBirth:
          type: string
          format: date
        roles:
          type: array
          items:
            type: string
        status:
          type: string

    PagedUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        message:
          type: string
          example: No Data

    CreateRoleRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        privilegeCodes:
          type: array
          items:
            type: string
        useDefaultPrivileges:
          type: boolean
          default: true

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        privilegeCodes:
          type: array
          items:
            type: string

    RoleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        privileges:
          type: array
          items:
            type: string

    PagedRoleResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
        totalElements:
          type: integer

    ReputationResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        score:
          type: number
        trustLevel:
          type: string
          enum: [UNTRUSTED, LOW, MEDIUM, HIGH, VERIFIED]
        avgRating:
          type: number
        totalRatings:
          type: integer
        transactionSummary:
          type: object
          properties:
            completedOrders:
              type: integer
            auctionsWon:
              type: integer

    CreateRatingRequest:
      type: object
      required: [rateeId, transactionType, transactionRefId, score]
      properties:
        rateeId:
          type: string
          format: uuid
        transactionType:
          type: string
          enum: [ORDER, AUCTION]
        transactionRefId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    ApplyPenaltyRequest:
      type: object
      required: [penaltyType, scoreDelta, reason]
      properties:
        penaltyType:
          type: string
        scoreDelta:
          type: number
        reason:
          type: string
        referenceType:
          type: string
        referenceId:
          type: string
          format: uuid

    PenaltyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        penaltyType:
          type: string
        scoreDelta:
          type: number
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time

security:
  - bearerAuth: []
